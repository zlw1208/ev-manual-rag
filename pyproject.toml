[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ev-manual-rag"
version = "0.1.0"
description = "新能源汽车说明书 RAG 问答系统"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.115,<1.0",
    "pdfplumber>=0.11,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27,<1.0",
    "pytest>=8,<10",
    "ruff>=0.9,<1.0",
]
retrieval = [
    "jieba>=0.42,<1.0",
    "mmh3>=5,<6",
    "qdrant-client[fastembed]>=1.14.2,<2.0",
]
generation = [
    "openai>=2.0,<3.0",
    "python-dotenv>=1.0,<2.0",
]
ui = [
    "streamlit>=1.40,<2.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
