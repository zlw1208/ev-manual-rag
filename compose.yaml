name: ev-manual-rag

services:
  qdrant:
    image: qdrant/qdrant:v1.19.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  indexer:
    build:
      context: .
    command:
      - python
      - scripts/build_index.py
      - --qdrant-url
      - http://qdrant:6333
      - --if-missing
      - --wait-seconds
      - "60"
    volumes:
      - model_cache:/app/.cache/fastembed
    depends_on:
      qdrant:
        condition: service_started
    restart: "no"

  api:
    build:
      context: .
    command:
      - python
      - -m
      - uvicorn
      - app.api.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8001"
    env_file:
      - .env
    environment:
      QDRANT_URL: http://qdrant:6333
    ports:
      - "127.0.0.1:8001:8001"
    volumes:
      - model_cache:/app/.cache/fastembed
    depends_on:
      indexer:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=3).read()
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 180s
    restart: unless-stopped

  frontend:
    build:
      context: .
    command:
      - python
      - -m
      - streamlit
      - run
      - frontend/streamlit_app.py
      - --server.address=0.0.0.0
      - --server.port=8501
      - --server.headless=true
    environment:
      RAG_API_BASE_URL: http://api:8001
    ports:
      - "127.0.0.1:8501:8501"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  qdrant_data:
  model_cache:
